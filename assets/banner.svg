<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <radialGradient id="meshGlow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="meshGlow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style><![CDATA[
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 44px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #cbd5e1;
    }

    /* Ambient Pulsing and Dynamic Float Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(8px); }
    }
    @keyframes floatParticleRev {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(14px) translateX(-6px); }
    }

    .ambient-glow-1 {
      animation: pulseGlow 7s ease-in-out infinite;
      transform-origin: 220px 110px;
    }
    .ambient-glow-2 {
      animation: pulseGlow 9s ease-in-out infinite alternate;
      transform-origin: 980px 250px;
    }
    .float-1 {
      animation: floatParticle 5s ease-in-out infinite;
    }
    .float-2 {
      animation: floatParticleRev 6s ease-in-out infinite;
    }
  ]]></style>

  <!-- Deep Sci-Fi Dark Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Ambient Light Orbs (Background layer) -->
  <circle cx="220" cy="110" r="280" fill="url(#meshGlow1)" class="ambient-glow-1" />
  <circle cx="980" cy="250" r="300" fill="url(#meshGlow2)" class="ambient-glow-2" />

  <!-- Cyber Spatial Perspective Grid (Background layer) -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="360" x2="600" y2="180" />
    <line x1="150" y1="360" x2="600" y2="180" />
    <line x1="300" y1="360" x2="600" y2="180" />
    <line x1="450" y1="360" x2="600" y2="180" />
    <line x1="750" y1="360" x2="600" y2="180" />
    <line x1="900" y1="360" x2="600" y2="180" />
    <line x1="1050" y1="360" x2="600" y2="180" />
    <line x1="1200" y1="360" x2="600" y2="180" />

    <line x1="100" y1="320" x2="1100" y2="320" />
    <line x1="220" y1="280" x2="980" y2="280" />
    <line x1="340" y1="240" x2="860" y2="240" />
    <line x1="440" y1="210" x2="760" y2="210" />
    <line x1="520" y1="190" x2="680" y2="190" />
  </g>

  <!-- Floating Polygonal XR Elements (Background / Ambient) -->
  <g class="float-1" opacity="0.45">
    <polygon points="120,70 145,55 170,70 170,100 145,115 120,100" fill="none" stroke="#06b6d4" stroke-width="1.8" />
    <circle cx="145" cy="85" r="4" fill="#38bdf8" />
  </g>
  <g class="float-2" opacity="0.4">
    <polygon points="1060,80 1090,60 1120,80 1120,115 1090,135 1060,115" fill="none" stroke="#a855f7" stroke-width="1.8" />
    <circle cx="1090" cy="98" r="4" fill="#c084fc" />
  </g>
  <g class="float-1" opacity="0.35">
    <polygon points="1020,260 1045,245 1070,260 1070,290 1045,305 1020,290" fill="none" stroke="#3b82f6" stroke-width="1.5" />
  </g>

  <!-- Foreground Content Container -->
  <!-- Category Pill Badge -->
  <g transform="translate(60, 48)">
    <rect width="320" height="32" rx="16" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1.2" />
    <circle cx="18" cy="16" r="5" fill="#38bdf8" />
    <text x="32" y="21" class="pill-text">SPATIAL COMPUTING &amp; XR PORTING</text>
  </g>

  <!-- Main Headline Title (Foreground) -->
  <g transform="translate(60, 132)">
    <text x="0" y="0" class="title-text">Awesome Mixed Reality Game Porting</text>
    <rect x="0" y="16" width="360" height="4" rx="2" fill="url(#cyberCyan)" />
  </g>

  <!-- Subtitle (Foreground) -->
  <g transform="translate(60, 190)">
    <text x="0" y="0" class="subtitle-text">Curated ecosystem of OpenXR runtimes, PCVR wireless streaming, flat-to-VR injectors,</text>
    <text x="0" y="28" class="subtitle-text">spatial passthrough modding frameworks &amp; standalone XR emulation ports.</text>
  </g>

  <!-- Key Capability Tags / Badges in Foreground -->
  <g transform="translate(60, 275)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect width="135" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <text x="14" y="21" class="badge-text">OpenXR 6DoF</text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(150, 0)">
      <rect width="145" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <text x="14" y="21" class="badge-text">UEVR &amp; Injectors</text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(310, 0)">
      <rect width="145" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <text x="14" y="21" class="badge-text">ALVR &amp; WiVRn</text>
    </g>

    <!-- Tag 4 -->
    <g transform="translate(470, 0)">
      <rect width="175" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <text x="14" y="21" class="badge-text">Passthrough Modding</text>
    </g>

    <!-- Tag 5 -->
    <g transform="translate(660, 0)">
      <rect width="155" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <text x="14" y="21" class="badge-text">Standalone Ports</text>
    </g>
  </g>

  <!-- Decorative Outer Border -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="15.5" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1" />
</svg>
